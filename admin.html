<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Shopping | Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav>
        <h2>Easy Shopping ♡</h2>
        <a href="index.html">Visit Store</a>
    </nav>

    <!-- Admin Login -->
    <div id="login">
        <h2>Admin Login</h2>

        <input type="password" id="password" placeholder="Enter Password">
        <button onclick="login()">Login</button>
    </div>

    <!-- Admin Dashboard -->
    <div id="dashboard" style="display: none;">

        <h1>Admin Dashboard</h1>
        <p>Manage your store and customer orders here.</p>

        <!-- Store Statistics -->
        <section class="stats">

            <div class="stat">
                <h2 id="productCount">0</h2>
                <p>Total product</p>
            </div>

            <div class="stat">
                <h2 id="orderCount">0</h2>
                <p>Total Orders</p>
            </div>

            <div class="stat">
                <h2 id="sales">0</h2>
                <p>Total Sales (Rs.)</p>
            </div>

        </section>

        <!-- Add product Form -->
        <h2>Add New product</h2>

        <div class="admin-form">

            <input type="text" id="pname" placeholder="product Name">
            <input type="number" id="price" placeholder="product Price">

            <p>Choose product Picture:</p>
            <input type="file" id="image" accept="image/*" onchange="previewImage()">

            <br>
            <img id="preview" width="100" style="display: none;">

            <br>
            <button onclick="addproduct()">Add product +</button>

        </div>

        <!-- product List -->
        <h2>Manage product</h2>
        <div id="productList" class="admin-list"></div>

        <!-- Customer Orders -->
        <h2>Customer Orders</h2>
        <div id="orderList" class="admin-list"></div>

    </div>

    <script src="admin.js"></script>

</body>
</html>
