<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easy Shopping | Admin</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <h2>Easy Shopping ♡</h2>
      <a href="index.html">Visit Store</a>
    </nav>

    <div id="login">
      <h2>Admin Login</h2>

      <input type="password" id="password" placeholder="Enter Password" />
      <button onclick="login()">Login</button>
    </div>

    <div id="dashboard" style="display: none">
      <h1>Admin Dashboard</h1>
      <p>Manage your store and customer orders here.</p>

      <section class="stats">
        <div class="stat">
          <h2 id="productCount">0</h2>
          <p>Total Products</p>
        </div>

        <div class="stat">
          <h2 id="orderCount">0</h2>
          <p>Total Orders</p>
        </div>

        <div class="stat">
          <h2 id="sales">0</h2>
          <p>Total Sales (Rs.)</p>
        </div>
      </section>

      <h2>Add New Product</h2>

      <div class="admin-form">
        <input type="text" id="pname" placeholder="Product Name" />
        <input type="number" id="price" placeholder="Product Price" />

        <p>Choose Product Picture:</p>
        <input
          type="file"
          id="image"
          accept="image/*"
          onchange="previewImage()"
        />

        <img id="preview" width="100" style="display: none" />

        <button onclick="addproduct()">Add Product +</button>
      </div>

      <h2>Manage Products</h2>
      <div id="productList" class="admin-list"></div>

      <h2>Customer Orders</h2>
      <div id="orderList" class="admin-list"></div>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
